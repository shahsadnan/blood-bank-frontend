<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blood Requests - UBBDMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .navbar-brand { color: white !important; font-weight: bold; }
        .request-card { border-left: 4px solid #c0392b; transition: transform 0.2s; }
        .request-card:hover { transform: translateY(-3px); }
        .blood-badge {
            background: #c0392b;
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg" style="background-color: #c0392b;">
    <div class="container">
        <a class="navbar-brand" href="#">🩸 UBBDMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" href="donor-dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="search-donor.html">Search Donors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="blood-request.html">Blood Requests</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="donation-history.html">My History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" id="logoutBtn">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Post Request Section -->
    <div class="card p-4 shadow mb-4">
        <h4 style="color:#c0392b;">🩸 Post Emergency Blood Request</h4>
        <hr>
        <form id="requestForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Patient Name</label>
                    <input type="text" class="form-control" id="patient_name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Blood Group Needed</label>
                    <select class="form-control" id="blood_group" required>
                        <option value="">Select</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>O+</option>
                        <option>O-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Hospital Name</label>
                    <input type="text" class="form-control" id="hospital_name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Location</label>
                    <input type="text" class="form-control" id="location" required>
                </div>
            </div>
            <div class="mb-3">
                <label>Contact Number</label>
                <input type="text" class="form-control" id="contact_number" required>
            </div>
            <button type="submit" class="btn btn-danger w-100">
                🚨 Post Emergency Request
            </button>
        </form>
    </div>

    <!-- Active Requests Section -->
    <h4 style="color:#c0392b;">📋 Active Blood Requests</h4>
    <div class="mb-2">
        <span id="requestCount" class="text-muted"></span>
    </div>
    <div id="requestList" class="row">
        <div class="col-12 text-center text-muted mt-3">
            <p>Loading requests...</p>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Check login
const token = localStorage.getItem("token");
if (!token) {
    alert("Please login first!");
    window.location.href = "login.html";
}

// POST BLOOD REQUEST
document.getElementById("requestForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const request = {
        patient_name: document.getElementById("patient_name").value,
        blood_group: document.getElementById("blood_group").value,
        hospital_name: document.getElementById("hospital_name").value,
        location: document.getElementById("location").value,
        contact_number: document.getElementById("contact_number").value
    };

    try {
        const response = await fetch("https://blood-bank-backend-xwde.onrender.com/api/request/create", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify(request)
        });

        const data = await response.json();
        alert(data.message);

        document.getElementById("requestForm").reset();

        // Reload requests
        loadRequests();

    } catch (error) {
        alert("Error connecting to server");
    }
});

// LOAD ALL ACTIVE REQUESTS
async function loadRequests() {
    try {
        const response = await fetch("https://blood-bank-backend-xwde.onrender.com/api/request/all", {
            headers: { "Authorization": "Bearer " + token }
        });

        const requests = await response.json();
        displayRequests(requests);

    } catch (error) {
        console.error(error);
    }
}

// DISPLAY REQUESTS
function displayRequests(requests) {
    const container = document.getElementById("requestList");
    const countEl = document.getElementById("requestCount");

    if (requests.length === 0) {
        countEl.textContent = "No active requests";
        container.innerHTML = `
            <div class="col-12 text-center mt-3">
                <p class="text-muted">No active blood requests at the moment</p>
            </div>`;
        return;
    }

    countEl.textContent = requests.length + " active request(s)";

    container.innerHTML = requests.map(req => {
        const date = new Date(req.request_date).toLocaleDateString();
        return `
        <div class="col-md-6 mb-3">
            <div class="card p-3 shadow request-card">
                <div class="d-flex align-items-start gap-3">
                    <div class="blood-badge">${req.blood_group}</div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between">
                            <h5 class="mb-1">${req.patient_name}</h5>
                            <span class="status-pending">⏳ Pending</span>
                        </div>
                        <p class="mb-1 text-muted">
                            🏥 ${req.hospital_name}
                        </p>
                        <p class="mb-1 text-muted">
                            📍 ${req.location}
                        </p>
                        <p class="mb-1">
                            📞 ${req.contact_number}
                        </p>
                        <p class="mb-1 text-muted">
                            👤 Posted by: ${req.donor_name || "Anonymous"}
                        </p>
                        <p class="mb-2 text-muted">
                            📅 ${date}
                        </p>
                        <button class="btn btn-sm btn-success" 
                            onclick="fulfillRequest(${req.request_id})">
                            ✅ Mark as Fulfilled
                        </button>
                    </div>
                </div>
            </div>
        </div>`;
    }).join("");
}

// MARK AS FULFILLED
async function fulfillRequest(id) {
    if (!confirm("Mark this request as fulfilled?")) return;

    try {
        const response = await fetch("https://blood-bank-backend-xwde.onrender.com/api/request/fulfill/" + id, {
            method: "PUT",
            headers: { "Authorization": "Bearer " + token }
        });

        const data = await response.json();
        alert(data.message);
        loadRequests();

    } catch (error) {
        alert("Error updating request");
    }
}

// Logout
document.getElementById("logoutBtn").addEventListener("click", function() {
    localStorage.clear();
    window.location.href = "login.html";
});

// Load on start
loadRequests();
</script>

</body>
</html>
