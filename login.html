<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - UBBDMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="text-center mb-4" style="color:#c0392b;">
                🩸 UBBDMS Login
            </h2>

            <div class="card p-4 shadow">
                <form id="loginForm">
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>

                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>

                    <button type="submit" class="btn btn-danger w-100">
                        Login
                    </button>

                    <div class="text-center mt-3">
                        <a href="register.html">Don't have an account? Register</a>
                    </div>

                    <div class="text-center mt-2">
                        <a href="admin/admin-login.html">Admin Login →</a>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("https://blood-bank-backend-xwde.onrender.com/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            // Save token
            localStorage.setItem("token", data.token);
            localStorage.setItem("donorName", data.name);

            alert("Welcome, " + data.name + "!");
            window.location.href = "donor-dashboard.html";
        } else {
            alert(data.message);
        }

    } catch (error) {
        alert("Error connecting to server");
    }
});
</script>

</body>
</html>
