<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donation History - UBBDMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .navbar-brand { color: white !important; font-weight: bold; }
        .history-card { border-left: 4px solid #c0392b; }
        .stat-box {
            background: #c0392b;
            color: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg" style="background-color: #c0392b;">
    <div class="container">
        <a class="navbar-brand" href="#">🩸 UBBDMS</a>
        <button class="navbar-toggler" type="button" 
            data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" href="donor-dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="search-donor.html">Search Donors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="blood-request.html">Blood Requests</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="donation-history.html">My History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" id="logoutBtn">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Stats Row -->
    <div class="row mb-4">
        <div class="col-md-4 mb-3">
            <div class="stat-box">
                <h2 id="totalDonations">0</h2>
                <p class="mb-0">Total Donations</p>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="stat-box">
                <h2 id="lastDonationDate">-</h2>
                <p class="mb-0">Last Donation</p>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="stat-box">
                <h2 id="eligibilityStatus">-</h2>
                <p class="mb-0">Eligibility</p>
            </div>
        </div>
    </div>

    <!-- Add Donation Record -->
    <div class="card p-4 shadow mb-4">
        <h4 style="color:#c0392b;">➕ Add Donation Record</h4>
        <hr>
        <form id="donationForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Donation Date</label>
                    <input type="date" class="form-control" 
                        id="donation_date" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Blood Group Donated</label>
                    <select class="form-control" id="blood_group" required>
                        <option value="">Select</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>O+</option>
                        <option>O-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label>Hospital Name</label>
                <input type="text" class="form-control" 
                    id="hospital" placeholder="Where did you donate?" required>
            </div>
            <div class="mb-3">
                <label>Notes (Optional)</label>
                <textarea class="form-control" id="notes" rows="2" 
                    placeholder="Any additional notes..."></textarea>
            </div>
            <button type="submit" class="btn btn-danger w-100">
                ➕ Add Donation Record
            </button>
        </form>
    </div>

    <!-- Donation History List -->
    <h4 style="color:#c0392b;">📋 My Donation History</h4>
    <div class="mb-2">
        <span id="historyCount" class="text-muted"></span>
    </div>

    <div id="historyList">
        <div class="text-center text-muted mt-3">
            <p>Loading history...</p>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Check login
const token = localStorage.getItem("token");
if (!token) {
    alert("Please login first!");
    window.location.href = "login.html";
}

// ADD DONATION RECORD
document.getElementById("donationForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const donation = {
        donation_date: document.getElementById("donation_date").value,
        blood_group: document.getElementById("blood_group").value,
        hospital: document.getElementById("hospital").value,
        notes: document.getElementById("notes").value
    };

    try {
        const response = await fetch("https://blood-bank-backend-xwde.onrender.com/api/donation/add", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify(donation)
        });

        const data = await response.json();
        alert(data.message);
        document.getElementById("donationForm").reset();
        loadHistory();

    } catch (error) {
        alert("Error connecting to server");
    }
});

// LOAD DONATION HISTORY
async function loadHistory() {
    try {
        const response = await fetch("https://blood-bank-backend-xwde.onrender.com/api/donation/my", {
            headers: { "Authorization": "Bearer " + token }
        });

        const donations = await response.json();
        displayHistory(donations);
        updateStats(donations);

    } catch (error) {
        console.error(error);
    }
}

// UPDATE STATS
function updateStats(donations) {
    document.getElementById("totalDonations").textContent = donations.length;

    if (donations.length > 0) {
        const lastDate = new Date(donations[0].donation_date)
            .toLocaleDateString();
        document.getElementById("lastDonationDate").textContent = lastDate;

        // Eligibility check
        const last = new Date(donations[0].donation_date);
        const today = new Date();
        const diffDays = Math.floor((today - last) / (1000 * 60 * 60 * 24));

        if (diffDays >= 90) {
            document.getElementById("eligibilityStatus").textContent = "✅ Eligible";
        } else {
            const left = 90 - diffDays;
            document.getElementById("eligibilityStatus").textContent = left + " days left";
        }
    } else {
        document.getElementById("lastDonationDate").textContent = "None yet";
        document.getElementById("eligibilityStatus").textContent = "✅ Eligible";
    }
}

// DISPLAY HISTORY
function displayHistory(donations) {
    const container = document.getElementById("historyList");
    const countEl = document.getElementById("historyCount");

    if (donations.length === 0) {
        countEl.textContent = "No donation records yet";
        container.innerHTML = `
            <div class="card p-4 text-center text-muted">
                <h5>No donation records found</h5>
                <p>Add your first donation record above!</p>
            </div>`;
        return;
    }

    countEl.textContent = donations.length + " record(s) found";

    container.innerHTML = donations.map(donation => {
        const date = new Date(donation.donation_date).toLocaleDateString();
        return `
        <div class="card p-3 shadow mb-3 history-card">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h5 class="mb-1">
                        🩸 ${donation.blood_group} 
                        <span class="badge" 
                            style="background:#c0392b; font-size:0.8rem;">
                            Donated
                        </span>
                    </h5>
                    <p class="mb-1 text-muted">
                        🏥 ${donation.hospital}
                    </p>
                    <p class="mb-1 text-muted">
                        📅 ${date}
                    </p>
                    ${donation.notes ? 
                        `<p class="mb-0 text-muted">📝 ${donation.notes}</p>` 
                        : ""}
                </div>
                <button class="btn btn-sm btn-outline-danger"
                    onclick="deleteRecord(${donation.donation_id})">
                    🗑️ Delete
                </button>
            </div>
        </div>`;
    }).join("");
}

// DELETE RECORD
async function deleteRecord(id) {
    if (!confirm("Delete this donation record?")) return;

    try {
        const response = await fetch("https://blood-bank-backend-xwde.onrender.com/api/donation/delete/" + id, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + token }
        });

        const data = await response.json();
        alert(data.message);
        loadHistory();

    } catch (error) {
        alert("Error deleting record");
    }
}

// Logout
document.getElementById("logoutBtn").addEventListener("click", function() {
    localStorage.clear();
    window.location.href = "login.html";
});

// Load on start
loadHistory();
</script>

</body>
</html>
