<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Send Notification - UBBDMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #f4f6f9; }
        .sidebar {
            background: #2c3e50;
            min-height: 100vh;
            padding-top: 20px;
        }
        .sidebar a {
            color: #bdc3c7;
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin: 2px 10px;
        }
        .sidebar a:hover { background: #c0392b; color: white; }
        .sidebar a.active { background: #c0392b; color: white; }
        .main-content { padding: 20px; }
        .section-title {
            color: #c0392b;
            border-bottom: 2px solid #c0392b;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<!-- TOP NAVBAR -->
<nav class="navbar" style="background-color: #c0392b;">
    <div class="container-fluid">
        <a class="navbar-brand text-white fw-bold">
            🩸 UBBDMS Admin Panel
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white" id="adminNameNav">Admin</span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">
                Logout
            </button>
        </div>
    </div>
</nav>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="sidebar" style="width: 220px; flex-shrink: 0;">
        <a href="admin-dashboard.html">📊 Dashboard</a>
        <a href="manage-donors.html">👥 Manage Donors</a>
        <a href="manage-requests.html">🩸 Manage Requests</a>
        <a href="send-notification.html" class="active">📢 Send Notification</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1 main-content">
        <h4 class="mb-4">📢 Send Notifications</h4>

        <!-- SEND TO ALL -->
        <div class="card p-4 shadow mb-4">
            <h5 class="section-title">📢 Send to All Donors</h5>
            <div id="allForm">
                <div class="mb-3">
                    <label>Title</label>
                    <input type="text" class="form-control"
                        id="allTitle" placeholder="e.g. Blood Donation Camp"
                        required>
                </div>
                <div class="mb-3">
                    <label>Message</label>
                    <textarea class="form-control" id="allMessage"
                        rows="4"
                        placeholder="Write your message here..."
                        required></textarea>
                </div>
                <button class="btn btn-danger w-100"
                    onclick="sendToAll()">
                    📢 Send to All Donors
                </button>
            </div>
            <div id="allResult" class="mt-3"></div>
        </div>

        <!-- SEND BY BLOOD GROUP -->
        <div class="card p-4 shadow mb-4">
            <h5 class="section-title">🚨 Send Urgent Alert by Blood Group</h5>
            <div class="mb-3">
                <label>Blood Group</label>
                <select class="form-control" id="urgentBloodGroup">
                    <option value="">Select Blood Group</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Title</label>
                <input type="text" class="form-control"
                    id="urgentTitle"
                    placeholder="e.g. Urgent Blood Needed">
            </div>
            <div class="mb-3">
                <label>Message</label>
                <textarea class="form-control" id="urgentMessage"
                    rows="4"
                    placeholder="Write urgent message..."></textarea>
            </div>
            <button class="btn btn-danger w-100"
                onclick="sendByBloodGroup()">
                🚨 Send Urgent Alert
            </button>
            <div id="urgentResult" class="mt-3"></div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
const adminToken = localStorage.getItem("adminToken");
if (!adminToken) {
    alert("Please login as admin!");
    window.location.href = "admin-login.html";
}

document.getElementById("adminNameNav").textContent =
    localStorage.getItem("adminName") || "Admin";

// SEND TO ALL DONORS
async function sendToAll() {
    const title = document.getElementById("allTitle").value;
    const message = document.getElementById("allMessage").value;

    if (!title || !message) {
        alert("Please fill title and message!");
        return;
    }

    const resultEl = document.getElementById("allResult");
    resultEl.innerHTML = `
        <div class="alert alert-info">
            ⏳ Sending emails... Please wait...
        </div>`;

    try {
        const response = await fetch(
            "https://blood-bank-backend-xwde.onrender.com/api/notification/send-all", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + adminToken
            },
            body: JSON.stringify({ title, message })
        });

        const data = await response.json();

        resultEl.innerHTML = `
            <div class="alert alert-success">
                ✅ ${data.message}
            </div>`;

        document.getElementById("allTitle").value = "";
        document.getElementById("allMessage").value = "";

    } catch (error) {
        resultEl.innerHTML = `
            <div class="alert alert-danger">
                ❌ Error sending notifications
            </div>`;
    }
}

// SEND BY BLOOD GROUP
async function sendByBloodGroup() {
    const blood_group = document.getElementById("urgentBloodGroup").value;
    const title = document.getElementById("urgentTitle").value;
    const message = document.getElementById("urgentMessage").value;

    if (!blood_group || !title || !message) {
        alert("Please fill all fields!");
        return;
    }

    const resultEl = document.getElementById("urgentResult");
    resultEl.innerHTML = `
        <div class="alert alert-info">
            ⏳ Sending urgent emails... Please wait...
        </div>`;

    try {
        const response = await fetch(
            "https://blood-bank-backend-xwde.onrender.com/api/notification/send-blood-group", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + adminToken
            },
            body: JSON.stringify({ title, message, blood_group })
        });

        const data = await response.json();

        resultEl.innerHTML = `
            <div class="alert alert-success">
                ✅ ${data.message}
            </div>`;

        document.getElementById("urgentBloodGroup").value = "";
        document.getElementById("urgentTitle").value = "";
        document.getElementById("urgentMessage").value = "";

    } catch (error) {
        resultEl.innerHTML = `
            <div class="alert alert-danger">
                ❌ Error sending notifications
            </div>`;
    }
}

// Logout
document.getElementById("logoutBtn").addEventListener("click", function() {
    localStorage.clear();
    window.location.href = "admin-login.html";
});
</script>

</body>
</html>
